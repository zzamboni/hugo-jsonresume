baseURL = "https://example.org/"
title = "Generic JSON Resume example"
languageCode = "en"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[module]
  [[module.imports]]
    path = "github.com/zzamboni/hugo-jsonresume"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  # Both examples intentionally exercise the same synthetic data contract.
  [[module.mounts]]
    source = "../exampleSite/data"
    target = "data"

[params.jsonresume]
  integration = "generic"
  resumeStem = "example-cv"
  excludeLinkRoles = ["site-home"]
