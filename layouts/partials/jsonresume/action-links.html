{{- $visible := partial "jsonresume/links.html" . -}}
{{- with $visible -}}
<nav class="{{ $.class }}" aria-label="{{ $.label }}">
  {{- range . -}}
    <a href="{{ .href | safeURL }}" {{ if $.floating }}aria-label="{{ .name }}" title="{{ .name }}"{{ end }}><span class="jsonresume-action-icon" aria-hidden="true">{{ partial "jsonresume/icon.html" (.icon | default "link") }}</span>{{ if not $.floating }}<span>{{ .name }}</span>{{ end }}</a>
  {{- end -}}
</nav>
{{- end -}}
